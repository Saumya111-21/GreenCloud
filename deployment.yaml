apiVersion: apps/v1
kind: Deployment
metadata:
  name: greencloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greencloud
  template:
    metadata:
      labels:
        app: greencloud
    spec:
      containers:
        - name: greencloud
          image: greencloud:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"